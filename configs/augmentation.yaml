augmentations:
  # Global augmentation settings
  enabled: true
  save_to_disk: true  # Save augmented images to disk instead of keeping in memory
  
  # ColorJitter Augmentation
  color_jitter:
    enabled: true
    num_samples: 1000
    params:
      brightness: [0.8, 2.0]
      contrast: [0.8, 2.0]
      saturation: [0.8, 2.0]
      hue: [-0.1, 0.1]
    random_seed: 47
  
  # Gaussian Blur Augmentation
  gaussian_blur:
    enabled: true
    num_samples: 500
    params:
      kernel_sizes: [3, 7]
      sigma_range: [0.1, 4.0]
    random_seed: 48
  
  # Flip Augmentation
  flip:
    enabled: true
    num_samples: 10
    types: ['hflip', 'vflip', 'hvflip']  # horizontal, vertical, both
    random_seed: 49
  
  # Rotation Augmentation (disabled by default - example for custom augmentation)
  rotation:
    enabled: false
    num_samples: 200
    params:
      angles: [-15, -10, -5, 5, 10, 15]
    random_seed: 50
  
  # Random Crop Augmentation (disabled by default)
  random_crop:
    enabled: true
    num_samples: 300
    params:
      crop_ratio: [0.8, 0.95]  # Percentage of original size
    random_seed: 51
  
  # Gaussian Noise (entire image)
  gaussian_noise:
    enabled: true
    num_samples: 20
    params:
      mean_range: [0.5, 1.5]
      sigma_range: [20.0, 70.0]
    random_seed: 50
  
  # Gaussian Noise to Bounding Boxes only
  gaussian_noise_bbox:
    enabled: true
    num_samples: 10
    params:
      mean_range: [0.0, 1.0]
      sigma_range: [5.0, 15.0]
    random_seed: 51
  
  # Random Erasing
  random_erasing:
    enabled: true
    num_samples: 20
    params:
      sl: 0.02  # Min proportion of erased area
      sh: 0.3   # Max proportion of erased area
      r1: 0.3   # Min aspect ratio
      max_erasing_area_per_bbox: 0.7  # Max % of any bbox that can be erased
      attempts: 100
    random_seed: 52
  
  # Random Blocking (Mean-value patches with Gaussian blur)
  random_blocking:
    enabled: true
    num_samples: 20  # Or use blocked_percentage instead
    params:
      blocked_percentage: 0.1  # Apply to 10% of images (if num_samples not used)
      probability: 1.0  # Probability of applying block (usually 1.0)
      max_patch: 0.5  # Max proportion of image to block (auto-calculated based on smallest bbox)
    random_seed: 53
